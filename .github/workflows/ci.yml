name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsLab.slnx

      - name: Build solution
        run: dotnet build DevOpsLab.slnx --no-restore

      - name: Run tests
        run: dotnet test DevOpsLab.slnx --no-build

      - name: Publish application
        run: dotnet publish DevOpsLab.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-lab
          path: ./publish

  verify:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-lab
          path: ./artifact

      - name: List artifact files
        run: ls -la ./artifact

      - name: Run published application
        run: dotnet ./artifact/DevOpsLab.dll